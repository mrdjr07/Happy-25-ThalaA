<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Happy 25 THALAAA 🫀</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="style.css">

</head>

<body>
  
<div id="startScreen" class="screen">

<h1 id="gameTitle">🐹 Hey!</h1>

<div id="gameIntro">

    <p>I'm <b>Capybara</b>.</p>

    <p>Catch me if you can! 😜</p>

    <p>You only have <b>3 chances</b>...</p>

</div>

<p id="statusText">Good Luck! 🍀</p>

<div class="holes" id="gameBoard">

        <div class="hole" id="hole0"></div>

        <div class="hole" id="hole1"></div>

        <div class="hole" id="hole2"></div>

        <div class="hole" id="hole3"></div>

    </div>

</div>

    <!-- Loading Screen -->
<div id="loadingScreen" style="display:none;">

        <h1>🎁</h1>

        <h2 id="loadingText">Loading Birthday Gift...</h2>

        <div class="progress">
            <div id="bar"></div>
        </div>

        <p id="percent">0%</p>

    </div>


    <!-- Welcome Screen -->
<div id="welcomeScreen">

    <div class="card">

        <h2 id="greeting"></h2>

        <h1 id="title"></h1>

        <p id="subtitle"></p>

    </div>

</div>


    <div id="verifyScreen">

    <div class="card">

        <h1>🔒 Identity Verification</h1>

        <p id="verifyText"></p>

    </div>

</div>

<div id="questionScreen">

    <div class="card">

        <h1>🤔 Quick Question...</h1>

        <p>Are you getting OLD?</p>

        <h2>Please answer honestly 😇</h2>

        <button id="yesBtn">YES 😭</button>

        <button id="noBtn">NO 😎</button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script src="script.js"></script>

<!-- Memory Wall -->
<div id="memoryWall" class="screen">

    <div id="memoryContainer"></div>

</div>

</body>

</html>
